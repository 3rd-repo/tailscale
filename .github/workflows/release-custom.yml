name: Release Custom Tailscale

# Model A: feature/custom is already based on an upstream release tag (kept
# there by rebase-feature.yml), so this workflow just builds it. The single
# input is the upstream release tag, used to (a) verify feature/custom is
# actually based on it and (b) name the release "<tag>-custom".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag the custom branch is based on (e.g. v1.104.7)'
        required: true
        type: string

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/custom
  BASE_TAG_REF: custom-base

jobs:
  verify:
    name: Verify base tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/custom
          fetch-depth: 0

      - name: Verify feature branch is based on ${{ inputs.tag }}
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -e
          git remote add upstream https://github.com/tailscale/tailscale.git 2>/dev/null || git remote set-url upstream https://github.com/tailscale/tailscale.git
          git fetch --force upstream "refs/tags/${REQUESTED_TAG}:refs/tags/${REQUESTED_TAG}"
          git fetch --force origin "refs/tags/${BASE_TAG_REF}:refs/tags/${BASE_TAG_REF}" || true

          WANT="$(git rev-parse "refs/tags/${REQUESTED_TAG}^{commit}")"
          HAVE="$(git rev-parse "refs/tags/${BASE_TAG_REF}^{commit}" 2>/dev/null || echo none)"
          echo "${FEATURE_BRANCH} base=${HAVE}  requested=${REQUESTED_TAG} (${WANT})"
          if [ "${WANT}" != "${HAVE}" ]; then
            echo "::error::${FEATURE_BRANCH} is based on ${HAVE}, not ${REQUESTED_TAG} (${WANT}). Run the 'Rebase feature branch onto upstream tag' workflow for ${REQUESTED_TAG} first."
            exit 1
          fi
          echo "Building ${FEATURE_BRANCH} @ $(git rev-parse --short HEAD) on top of ${REQUESTED_TAG}"

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_ext: ""
            archive_type: tar.gz
          - os: linux
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: darwin
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: windows
            arch: amd64
            binary_ext: .exe
            archive_type: zip

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/custom
          fetch-depth: 1

      - name: Show build source
        run: |
          echo "Building $(git rev-parse HEAD)"
          git log -1 --format='%H %s'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and package binary
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          GOOS="${{ matrix.os }}"
          GOARCH="${{ matrix.arch }}"
          EXT="${{ matrix.binary_ext }}"
          ARCHIVE="${{ matrix.archive_type }}"

          mkdir -p dist
          BUILD_DIR="build/${GOOS}_${GOARCH}"
          mkdir -p "${BUILD_DIR}"

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          echo "Downloading Go modules..."
          go mod download

          echo "Compiling ${GOOS}/${GOARCH}..."
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscale${EXT}" ./cmd/tailscale
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscaled${EXT}" ./cmd/tailscaled

          ARCHIVE_NAME="tailscale_${TAG}_${GOOS}_${GOARCH}.${ARCHIVE}"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "${BUILD_DIR}" && zip -r "../../dist/${ARCHIVE_NAME}" "tailscale${EXT}" "tailscaled${EXT}")
          else
            tar -czvf "dist/${ARCHIVE_NAME}" -C "${BUILD_DIR}" "tailscale${EXT}" "tailscaled${EXT}"
          fi

          echo "Package created: dist/${ARCHIVE_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  build-derper:
    name: Build DERP Server (linux/amd64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/custom
          fetch-depth: 1

      - name: Show build source
        run: |
          echo "Building $(git rev-parse HEAD)"
          git log -1 --format='%H %s'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and package derper
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          GOOS="linux"
          GOARCH="amd64"

          mkdir -p dist
          BUILD_DIR="build/${GOOS}_${GOARCH}"
          mkdir -p "${BUILD_DIR}"

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          echo "Downloading Go modules..."
          go mod download

          echo "Compiling derper (${GOOS}/${GOARCH})..."
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/derper" ./cmd/derper

          DERP_ARCHIVE="derper_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          tar -czvf "dist/${DERP_ARCHIVE}" -C "${BUILD_DIR}" "derper"
          echo "Package created: dist/${DERP_ARCHIVE}"

      - name: Upload derper artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-derper-linux-amd64
          path: dist/*
          retention-days: 1

  release:
    name: Publish Release Assets
    needs: [build, build-derper]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tailscale-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          UPSTREAM_TAG="${{ inputs.tag }}"

          echo "Downloaded build artifacts:"
          ls -lh dist/

          echo "Generating checksums..."
          (cd dist && rm -f sha256sums.txt && sha256sum * > sha256sums.txt)
          cat dist/sha256sums.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${GH_REPO}. Uploading assets with --clobber..."
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes "Tailscale custom release ${TAG} (upstream ${UPSTREAM_TAG} + custom features)." || true
          else
            echo "Creating new release ${TAG} in ${GH_REPO}..."
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --notes "Tailscale custom release ${TAG} (upstream ${UPSTREAM_TAG} + custom features)." \
              --draft=false \
              --prerelease=false || {
                echo "Creation failed, falling back to upload with --clobber..."
                gh release upload "${TAG}" dist/* --clobber
              }
          fi
