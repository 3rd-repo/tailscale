name: Release Custom Tailscale

# Build a binary from an upstream release tag plus the custom commits that
# live on feature/custom.
#
# Single input: the upstream release tag (e.g. v1.104.7). The workflow fetches
# that tag from upstream, applies the custom commits from feature/custom on top
# of it, then cross-compiles. The published release is named "<tag>-custom".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to build on (e.g. v1.104.7)'
        required: true
        type: string

permissions:
  contents: write

env:
  FEATURE_BRANCH: feature/custom
  MAIN_BRANCH: main

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_ext: ""
            archive_type: tar.gz
          - os: linux
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: darwin
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: windows
            arch: amd64
            binary_ext: .exe
            archive_type: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source (${{ inputs.tag }} + custom)
        env:
          UPSTREAM_TAG: ${{ inputs.tag }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching upstream tag ${UPSTREAM_TAG}..."
          git remote add upstream https://github.com/tailscale/tailscale.git 2>/dev/null || git remote set-url upstream https://github.com/tailscale/tailscale.git
          git fetch --force upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"

          echo "Fetching ${MAIN_BRANCH} and ${FEATURE_BRANCH}..."
          git fetch --force origin "refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}" "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"

          echo "Checking out clean upstream tag ${UPSTREAM_TAG}..."
          git checkout -B "build/${UPSTREAM_TAG}" "refs/tags/${UPSTREAM_TAG}"

          # The custom commits are exactly the ones on feature/custom that are
          # not on main (feature/custom is kept rebased on main).
          BASE="$(git merge-base "origin/${MAIN_BRANCH}" "origin/${FEATURE_BRANCH}")"
          COMMITS="$(git rev-list --reverse "${BASE}..origin/${FEATURE_BRANCH}")"
          if [ -z "${COMMITS}" ]; then
            echo "::error::No custom commits found on origin/${FEATURE_BRANCH}."
            exit 1
          fi

          echo "Applying custom commits onto ${UPSTREAM_TAG}:"
          echo "${COMMITS}"
          git cherry-pick -x ${COMMITS}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and package binary
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          GOOS="${{ matrix.os }}"
          GOARCH="${{ matrix.arch }}"
          EXT="${{ matrix.binary_ext }}"
          ARCHIVE="${{ matrix.archive_type }}"

          mkdir -p dist
          BUILD_DIR="build/${GOOS}_${GOARCH}"
          mkdir -p "${BUILD_DIR}"

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          echo "Downloading Go modules..."
          go mod download

          echo "Compiling ${GOOS}/${GOARCH}..."
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscale${EXT}" ./cmd/tailscale
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscaled${EXT}" ./cmd/tailscaled

          ARCHIVE_NAME="tailscale_${TAG}_${GOOS}_${GOARCH}.${ARCHIVE}"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "${BUILD_DIR}" && zip -r "../../dist/${ARCHIVE_NAME}" "tailscale${EXT}" "tailscaled${EXT}")
          else
            tar -czvf "dist/${ARCHIVE_NAME}" -C "${BUILD_DIR}" "tailscale${EXT}" "tailscaled${EXT}"
          fi

          echo "Package created: dist/${ARCHIVE_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  build-derper:
    name: Build DERP Server (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source (${{ inputs.tag }} + custom)
        env:
          UPSTREAM_TAG: ${{ inputs.tag }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching upstream tag ${UPSTREAM_TAG}..."
          git remote add upstream https://github.com/tailscale/tailscale.git 2>/dev/null || git remote set-url upstream https://github.com/tailscale/tailscale.git
          git fetch --force upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"

          echo "Fetching ${MAIN_BRANCH} and ${FEATURE_BRANCH}..."
          git fetch --force origin "refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}" "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/${FEATURE_BRANCH}"

          echo "Checking out clean upstream tag ${UPSTREAM_TAG}..."
          git checkout -B "build/${UPSTREAM_TAG}" "refs/tags/${UPSTREAM_TAG}"

          BASE="$(git merge-base "origin/${MAIN_BRANCH}" "origin/${FEATURE_BRANCH}")"
          COMMITS="$(git rev-list --reverse "${BASE}..origin/${FEATURE_BRANCH}")"
          if [ -z "${COMMITS}" ]; then
            echo "::error::No custom commits found on origin/${FEATURE_BRANCH}."
            exit 1
          fi

          echo "Applying custom commits onto ${UPSTREAM_TAG}:"
          echo "${COMMITS}"
          git cherry-pick -x ${COMMITS}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and package derper
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          GOOS="linux"
          GOARCH="amd64"

          mkdir -p dist
          BUILD_DIR="build/${GOOS}_${GOARCH}"
          mkdir -p "${BUILD_DIR}"

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          echo "Downloading Go modules..."
          go mod download

          echo "Compiling derper (${GOOS}/${GOARCH})..."
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/derper" ./cmd/derper

          DERP_ARCHIVE="derper_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          tar -czvf "dist/${DERP_ARCHIVE}" -C "${BUILD_DIR}" "derper"
          echo "Package created: dist/${DERP_ARCHIVE}"

      - name: Upload derper artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-derper-linux-amd64
          path: dist/*
          retention-days: 1

  release:
    name: Publish Release Assets
    needs: [build, build-derper]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tailscale-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ inputs.tag }}-custom"
          UPSTREAM_TAG="${{ inputs.tag }}"

          echo "Downloaded build artifacts:"
          ls -lh dist/

          echo "Generating checksums..."
          (cd dist && rm -f sha256sums.txt && sha256sum * > sha256sums.txt)
          cat dist/sha256sums.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${GH_REPO}. Uploading assets with --clobber..."
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes "Tailscale custom release ${TAG} (upstream ${UPSTREAM_TAG} + custom features)." || true
          else
            echo "Creating new release ${TAG} in ${GH_REPO}..."
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --notes "Tailscale custom release ${TAG} (upstream ${UPSTREAM_TAG} + custom features)." \
              --draft=false \
              --prerelease=false || {
                echo "Creation failed, falling back to upload with --clobber..."
                gh release upload "${TAG}" dist/* --clobber
              }
          fi
