name: Release Custom Tailscale

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Upstream Release Tag (e.g. v1.104.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply custom features to target tag
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          BASE_TAG="${TAG%-custom}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fetching all tags and remote branches..."
          git fetch --tags origin
          git fetch origin feature/custom:refs/remotes/origin/feature/custom || true

          # If the base tag is not in origin, fetch tags from upstream
          if ! git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            echo "Tag ${BASE_TAG} not found in origin. Fetching from upstream..."
            git remote add upstream https://github.com/tailscale/tailscale.git || true
            git fetch --tags upstream
          fi

          if ! git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            echo "Error: Tag ${BASE_TAG} does not exist in origin or upstream!"
            exit 1
          fi

          echo "Checking out clean tag ${BASE_TAG}..."
          git checkout -B "build-${TAG}" "refs/tags/${BASE_TAG}"

          echo "Determining custom commits on origin/feature/custom..."
          BASE=$(git merge-base origin/main origin/feature/custom)
          COMMITS=$(git rev-list --reverse "${BASE}..origin/feature/custom")

          if [ -n "${COMMITS}" ]; then
            echo "Cherry-picking custom commits onto ${BASE_TAG}:"
            echo "${COMMITS}"
            git cherry-pick ${COMMITS}
          else
            echo "No custom commits detected to cherry-pick."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binaries
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          mkdir -p dist

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          # Linux amd64 (x86_64)
          echo "Building linux/amd64..."
          mkdir -p build/linux_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/linux_amd64/tailscale ./cmd/tailscale
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/linux_amd64/tailscaled ./cmd/tailscaled
          tar -czvf "dist/tailscale_${TAG}_linux_amd64.tar.gz" -C build/linux_amd64 tailscale tailscaled

          # Linux arm64
          echo "Building linux/arm64..."
          mkdir -p build/linux_arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build/linux_arm64/tailscale ./cmd/tailscale
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build/linux_arm64/tailscaled ./cmd/tailscaled
          tar -czvf "dist/tailscale_${TAG}_linux_arm64.tar.gz" -C build/linux_arm64 tailscale tailscaled

          # macOS arm64 (Apple Silicon: M1/M2/M3/M4)
          echo "Building darwin/arm64..."
          mkdir -p build/darwin_arm64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build/darwin_arm64/tailscale ./cmd/tailscale
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o build/darwin_arm64/tailscaled ./cmd/tailscaled
          tar -czvf "dist/tailscale_${TAG}_darwin_arm64.tar.gz" -C build/darwin_arm64 tailscale tailscaled

          # macOS amd64 (Intel)
          echo "Building darwin/amd64..."
          mkdir -p build/darwin_amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/darwin_amd64/tailscale ./cmd/tailscale
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/darwin_amd64/tailscaled ./cmd/tailscaled
          tar -czvf "dist/tailscale_${TAG}_darwin_amd64.tar.gz" -C build/darwin_amd64 tailscale tailscaled

          # Windows amd64 (x86_64)
          echo "Building windows/amd64..."
          mkdir -p build/windows_amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/windows_amd64/tailscale.exe ./cmd/tailscale
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o build/windows_amd64/tailscaled.exe ./cmd/tailscaled
          (cd build/windows_amd64 && zip -r "../../dist/tailscale_${TAG}_windows_amd64.zip" tailscale.exe tailscaled.exe)

          # Generate sha256 checksums
          echo "Generating checksums..."
          (cd dist && sha256sum * > sha256sums.txt)

      - name: Publish Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Uploading assets with --clobber..."
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes "Tailscale custom release ${TAG} (with force-derp and auto no-logs-no-support features)." || true
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --notes "Tailscale custom release ${TAG} (with force-derp and auto no-logs-no-support features)." \
              --draft=false \
              --prerelease=false || {
                echo "Creation failed, falling back to upload with --clobber..."
                gh release upload "${TAG}" dist/* --clobber
              }
          fi
