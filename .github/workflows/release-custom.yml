name: Release Custom Tailscale

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target Upstream Release Tag (e.g. v1.104.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_ext: ""
            archive_type: tar.gz
          - os: linux
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: darwin
            arch: arm64
            binary_ext: ""
            archive_type: tar.gz
          - os: windows
            arch: amd64
            binary_ext: .exe
            archive_type: zip

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply custom features to target tag
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          BASE_TAG="${TAG%-custom}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fetching all tags and remote branches..."
          git fetch --tags origin
          git fetch origin feature/custom:refs/remotes/origin/feature/custom || true

          # If the base tag is not in origin, fetch tags from upstream
          if ! git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            echo "Tag ${BASE_TAG} not found in origin. Fetching from upstream..."
            git remote add upstream https://github.com/tailscale/tailscale.git || true
            git fetch --tags upstream
            git remote remove upstream || true
          fi

          if ! git rev-parse -q --verify "refs/tags/${BASE_TAG}" >/dev/null; then
            echo "Error: Tag ${BASE_TAG} does not exist in origin or upstream!"
            exit 1
          fi

          echo "Checking out clean tag ${BASE_TAG}..."
          git checkout -B "build-${TAG}" "refs/tags/${BASE_TAG}"

          echo "Determining custom commits on origin/feature/custom..."
          BASE=$(git merge-base origin/main origin/feature/custom)
          COMMITS=$(git rev-list --reverse "${BASE}..origin/feature/custom")

          if [ -n "${COMMITS}" ]; then
            echo "Cherry-picking custom commits onto ${BASE_TAG}:"
            echo "${COMMITS}"
            git cherry-pick ${COMMITS}
          else
            echo "No custom commits detected to cherry-pick."
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and package binary
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          GOOS="${{ matrix.os }}"
          GOARCH="${{ matrix.arch }}"
          EXT="${{ matrix.binary_ext }}"
          ARCHIVE="${{ matrix.archive_type }}"

          mkdir -p dist
          BUILD_DIR="build/${GOOS}_${GOARCH}"
          mkdir -p "${BUILD_DIR}"

          LDFLAGS="-s -w -X tailscale.com/version.longStamp=${TAG} -X tailscale.com/version.shortStamp=${TAG}"

          echo "Downloading Go modules..."
          go mod download

          echo "Compiling ${GOOS}/${GOARCH}..."
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscale${EXT}" ./cmd/tailscale
          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -ldflags="${LDFLAGS}" -o "${BUILD_DIR}/tailscaled${EXT}" ./cmd/tailscaled

          ARCHIVE_NAME="tailscale_${TAG}_${GOOS}_${GOARCH}.${ARCHIVE}"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd "${BUILD_DIR}" && zip -r "../../dist/${ARCHIVE_NAME}" "tailscale${EXT}" "tailscaled${EXT}")
          else
            tar -czvf "dist/${ARCHIVE_NAME}" -C "${BUILD_DIR}" "tailscale${EXT}" "tailscaled${EXT}"
          fi

          echo "Package created: dist/${ARCHIVE_NAME}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tailscale-*
          path: dist
          merge-multiple: true

      - name: Generate Checksums & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"

          echo "Downloaded build artifacts:"
          ls -lh dist/

          echo "Generating checksums..."
          (cd dist && rm -f sha256sums.txt && sha256sum * > sha256sums.txt)
          cat dist/sha256sums.txt

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in ${GH_REPO}. Uploading assets with --clobber..."
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --notes "Tailscale custom release ${TAG} (with force-derp and auto no-logs-no-support features)." || true
          else
            echo "Creating new release ${TAG} in ${GH_REPO}..."
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --notes "Tailscale custom release ${TAG} (with force-derp and auto no-logs-no-support features)." \
              --draft=false \
              --prerelease=false || {
                echo "Creation failed, falling back to upload with --clobber..."
                gh release upload "${TAG}" dist/* --clobber
              }
          fi
