name: Rebase feature branch onto upstream tag

# Model A: feature/custom is kept based on an upstream *release tag*, so a
# release build is exactly "<tag> + custom features" with no cherry-picking.
#
# Run this manually with the upstream release tag to move onto. It rebases
# feature/custom from the currently recorded base (the "custom-base" git tag)
# onto that upstream tag.
#
# - Clean rebase: build check, then push feature/custom and update custom-base.
# - Conflicts:    write a Job Summary listing the conflicting files and hunk
#                 counts, upload a full report as an artifact, and fail.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag to rebase onto (e.g. v1.104.7)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rebase-feature
  cancel-in-progress: true

env:
  FEATURE_BRANCH: feature/custom
  BASE_TAG_REF: custom-base

jobs:
  rebase:
    name: Rebase feature/custom onto ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/custom
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tag and current base
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          set -e
          git remote add upstream https://github.com/tailscale/tailscale.git 2>/dev/null || git remote set-url upstream https://github.com/tailscale/tailscale.git
          git fetch --force upstream "refs/tags/${NEW_TAG}:refs/tags/${NEW_TAG}"
          echo "NEW_TAG_SHA=$(git rev-parse "refs/tags/${NEW_TAG}^{commit}")" >> "$GITHUB_ENV"

          git fetch --force origin "refs/tags/${BASE_TAG_REF}:refs/tags/${BASE_TAG_REF}" || true
          OLD_BASE="$(git rev-parse "refs/tags/${BASE_TAG_REF}^{commit}" 2>/dev/null || echo "")"
          if [ -z "${OLD_BASE}" ]; then
            echo "::error::Base tag ${BASE_TAG_REF} not found on origin; cannot determine the current base."
            exit 1
          fi
          echo "OLD_BASE_SHA=${OLD_BASE}" >> "$GITHUB_ENV"
          echo "Rebasing ${FEATURE_BRANCH}: ${OLD_BASE} -> ${NEW_TAG}"

      - name: Rebase onto ${{ inputs.tag }}
        id: rebase
        continue-on-error: true
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          git rebase --onto "${NEW_TAG_SHA}" "${OLD_BASE_SHA}"

      - name: Summary - clean
        if: steps.rebase.outcome == 'success'
        run: |
          {
            echo "## ✅ Rebase 成功"
            echo ""
            echo "\`${FEATURE_BRANCH}\` 已从 \`$(git rev-parse --short "${OLD_BASE_SHA}")\` 迁移到 \`${{ inputs.tag }}\` (\`$(git rev-parse --short "${NEW_TAG_SHA}")\`)。"
            echo ""
            echo "- 定制提交数: $(git rev-list --count "${NEW_TAG_SHA}..HEAD")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary - conflict
        if: steps.rebase.outcome == 'failure'
        run: |
          set -u
          STOPPED_SHA="$(git rev-parse REBASE_HEAD 2>/dev/null || true)"
          CONFLICT_FILES="$(git diff --name-only --diff-filter=U)"
          CONFLICT_COUNT="$(printf '%s\n' "$CONFLICT_FILES" | grep -c . || true)"
          {
            echo "## ⚠️ Rebase 冲突"
            echo ""
            echo "\`${FEATURE_BRANCH}\` 无法自动 rebase 到 \`${{ inputs.tag }}\`，需要手动处理。"
            echo ""
            echo "- 新基线: \`${{ inputs.tag }}\` (\`$(git rev-parse --short "${NEW_TAG_SHA}" 2>/dev/null || echo '?')\`)"
            echo "- 旧基线: \`$(git rev-parse --short "${OLD_BASE_SHA}" 2>/dev/null || echo '?')\`"
            if [ -n "${STOPPED_SHA}" ]; then
              echo "- 卡在提交: \`$(git log -1 --oneline "${STOPPED_SHA}" 2>/dev/null || echo "${STOPPED_SHA}")\`"
            fi
            echo "- 冲突文件数: **${CONFLICT_COUNT}**"
            echo ""
            echo "| 文件 | 冲突块数 |"
            echo "|---|---|"
            printf '%s\n' "$CONFLICT_FILES" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              n="$(grep -c '^<<<<<<<' "$f" 2>/dev/null || true)"
              echo "| \`$f\` | ${n} |"
            done
            echo ""
            echo "### 本地处理"
            echo '```bash'
            echo "git fetch origin --tags"
            echo "git checkout ${FEATURE_BRANCH}"
            echo "git rebase --onto ${{ inputs.tag }} ${BASE_TAG_REF}"
            echo "# 解决冲突后"
            echo "git push --force-with-lease origin ${FEATURE_BRANCH}"
            echo "git tag -f ${BASE_TAG_REF} ${{ inputs.tag }}"
            echo "git push --force origin refs/tags/${BASE_TAG_REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff > /tmp/conflicts.diff || true
          git status > /tmp/status.txt || true

      - name: Upload conflict report
        if: steps.rebase.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rebase-conflicts
          path: |
            /tmp/conflicts.diff
            /tmp/status.txt
          retention-days: 7

      - name: Set up Go
        if: steps.rebase.outcome == 'success'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build check
        if: steps.rebase.outcome == 'success'
        run: |
          CGO_ENABLED=0 go build ./cmd/tailscale ./cmd/tailscaled ./cmd/derper

      - name: Push rebased branch and update base tag
        if: steps.rebase.outcome == 'success'
        env:
          NEW_TAG: ${{ inputs.tag }}
        run: |
          set -e
          git push --force-with-lease origin "HEAD:${FEATURE_BRANCH}"
          git tag -f "${BASE_TAG_REF}" "${NEW_TAG_SHA}"
          git push --force origin "refs/tags/${BASE_TAG_REF}"

      - name: Fail job when conflicts were found
        if: steps.rebase.outcome == 'failure'
        run: |
          echo "::error::${FEATURE_BRANCH} rebase onto ${{ inputs.tag }} has conflicts; see the job summary."
          exit 1
